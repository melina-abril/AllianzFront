<div class="app-shell">
  <header class="app-header">
    <a class="app-brand" routerLink="/quotes" aria-label="Allianz, ir al cotizador">Allianz</a>
    <div class="app-session">
      <span class="app-session__name">{{ currentUser.user().name }}</span>
      <label for="test-role">Rol de prueba</label>
      <select id="test-role" [value]="currentUser.user().role" (change)="onRoleChange($event)">
        @for (role of roles; track role.value) {
          <option [value]="role.value">{{ role.label }}</option>
        }
      </select>
    </div>
  </header>

  <div class="app-body">
    <nav class="app-sidebar" aria-label="Navegación principal">
      <p class="app-sidebar__heading">Funcionalidades</p>
      @for (item of navigation; track item.path) {
        @if (currentUser.hasRole(item.roles)) {
          <a class="app-nav-link" [routerLink]="item.path" routerLinkActive="app-nav-link--active" [routerLinkActiveOptions]="{ exact: false }">{{ item.label }}</a>
        }
      }
    </nav>
    <main class="app-main" id="main-content">
      <router-outlet />
    </main>
  </div>
</div>
