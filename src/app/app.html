<div class="app-shell">
  <header class="app-header">
    <a class="app-brand" routerLink="/quotes" aria-label="Allianz, ir al cotizador">Allianz</a>
    <div class="app-account">
      <span class="app-account__name">{{ currentUser.user().name }}</span>
      <label for="test-role">Rol de prueba</label>
      <select id="test-role" #roleSelect [value]="currentUser.user().role" (change)="changeRole(roleSelect.value)">
        <option value="insured">Asegurado</option>
        <option value="producer">Productor asesor</option>
        <option value="operator">Operador de emisión</option>
        <option value="adjuster">Liquidador de siniestros</option>
        <option value="supervisor">Supervisor</option>
      </select>
    </div>
  </header>
  <div class="app-body">
    <nav class="app-nav" aria-label="Navegación principal">
      <p class="app-nav__heading">Secciones</p>
      @for (item of navigation; track item.path) {
        @if (currentUser.hasRole(item.roles)) {
          <a [routerLink]="item.path" routerLinkActive="app-nav__link--active" class="app-nav__link" [attr.aria-label]="item.label">{{ item.label }}</a>
        }
      }
    </nav>
    <main class="app-content" id="main-content">
      <router-outlet />
    </main>
  </div>
</div>
